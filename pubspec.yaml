name: chestsense
description: "ChestSense - AI-powered chest X-ray analysis app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.1.0
  provider: ^6.1.2
  google_sign_in: ^6.2.1

  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.1.7
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - test-images/

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

